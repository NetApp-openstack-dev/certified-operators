apiVersion: operators.coreos.com/v1alpha1
kind: ClusterServiceVersion
metadata:
  capabilities: Deep Insights
  name: trident-operator.v26.10.2
  annotations:
    alm-examples: |
      [
        {
          "apiVersion": "trident.netapp.io/v1",
          "kind": "TridentOrchestrator",
          "metadata": {
            "name": "trident"
          },
          "spec": {
            "IPv6": false,
            "debug": true,
            "nodePrep": [],
            "imagePullSecrets": [],
            "imageRegistry": "",
            "namespace": "trident",
            "silenceAutosupport": false
          }
        }
      ]
    categories: Storage
    containerImage:
      registry.connect.redhat.com/netapp/trident-operator-image@sha256:88343e9c416fc4a1b107c39e3b906510a1771fea2b4a136e35aa76ed19137e2b
    description: Trident Operator, to manage NetApp Trident installations
    repository: https://github.com/netapp/trident
    support: NetApp
    operatorhub.io/ui-metadata-max-k8s-version: '1.37'
    operators.openshift.io/valid-subscription: No subscriptions are required
    features.operators.openshift.io/disconnected: 'true'
    features.operators.openshift.io/fips-compliant: 'false'
    features.operators.openshift.io/proxy-aware: 'false'
    features.operators.openshift.io/tls-profiles: 'false'
    features.operators.openshift.io/token-auth-aws: 'false'
    features.operators.openshift.io/token-auth-azure: 'false'
    features.operators.openshift.io/token-auth-gcp: 'false'
    features.operators.openshift.io/csi: 'true'
    createdAt: 2026-11-25
spec:
  customresourcedefinitions:
    owned:
    - description: Used to deploy NetApp Trident.
      displayName: Trident Orchestrator
      kind: TridentOrchestrator
      name: tridentorchestrators.trident.netapp.io
      version: v1
  description: |
    NetApp Trident is an open source storage provisioner and orchestrator maintained by NetApp. It enables you to create storage volumes for containerized applications managed by Docker and Kubernetes. For full release information, including patch release changes, see https://docs.netapp.com/us-en/trident/trident-rn.html.

    Due to an issue being investigated by Red Hat and NetApp, oc-mirror cannot sync Windows container images that are part of the Trident-certified operator manifest hosted on registry.connect.redhat.com. This new manifest only points to Linux-only container images. Windows users should use the Trident community operator until this issue is addressed.
  displayName: NetApp Trident
  icon:
  - base64data: |
      
    mediatype: image/png
  install:
    spec:
      deployments:
      - name: trident-operator
        spec:
          replicas: 1
          selector:
            matchLabels:
              app: operator.trident.netapp.io
              name: trident-operator
          strategy:
            type: Recreate
          template:
            metadata:
              labels:
                app: operator.trident.netapp.io
                name: trident-operator
            spec:
              containers:
              - command:
                - /trident-operator
                - --debug
                env:
                - name: POD_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
                - name: OPERATOR_NAME
                  value: trident-operator
                - name: DEFAULT_TRIDENT_IMAGE
                  value:
                    registry.connect.redhat.com/netapp/trident@sha256:4787bf8bf2ba4ca3107652e5a8351b4d958fa5973fa7c46e8c04a1292a9167d8
                - name: DEFAULT_TRIDENT_AUTOSUPPORT_IMAGE
                  value:
                    registry.connect.redhat.com/netapp/trident-autosupport@sha256:c5135a0acb3d251ee5381eeb97599bffec1d725447c66a01318116d51d439b45
                - name: TRIDENT_CSI_SIDECAR_PROVISIONER_IMAGE
                  value:
                    registry.redhat.io/openshift4/ose-csi-external-provisioner-rhel9@sha256:ae296ab0164ad7a5ec6c5298a2e22c04d23648245aeaeaa477e3fab42867a3c7
                - name: TRIDENT_CSI_SIDECAR_ATTACHER_IMAGE
                  value:
                    registry.redhat.io/openshift4/ose-csi-external-attacher-rhel9@sha256:125b7cede1f8a64ef56aeaf2cc8fdef253db61be0287ec55c78d45d9faffb27a
                - name: TRIDENT_CSI_SIDECAR_RESIZER_IMAGE
