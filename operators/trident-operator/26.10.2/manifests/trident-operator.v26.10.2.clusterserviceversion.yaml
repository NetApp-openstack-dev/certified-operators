                - name: TRIDENT_CSI_SIDECAR_NODE_DRIVER_REGISTRAR_IMAGE
                  value:
                    registry.redhat.io/openshift4/ose-csi-node-driver-registrar-rhel9@sha256:649f8fa6e6d1c83c62dda8239a1dd65092dd7a688c14dda395d9221bddd5dada
                - name: TRIDENT_CSI_SIDECAR_LIVENESS_PROBE_IMAGE
                  value:
                    registry.redhat.io/openshift4/ose-csi-livenessprobe-rhel9@sha256:7d6eda83cbb652c8088595165091f30e9b1f4611f8e5f016c840ecbc78b6887c
                image:
                  registry.connect.redhat.com/netapp/trident-operator-image@sha256:88343e9c416fc4a1b107c39e3b906510a1771fea2b4a136e35aa76ed19137e2b
                imagePullPolicy: IfNotPresent
                name: trident-operator
              nodeSelector:
                kubernetes.io/arch: amd64
                kubernetes.io/os: linux
              serviceAccountName: trident-operator
